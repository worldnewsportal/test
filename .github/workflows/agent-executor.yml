name: Agent Remote Python Executor

on:
  workflow_dispatch:
    inputs:
      task_name:
        description: 'Task Title'
        required: true
        type: string
      python_code:
        description: 'Python code to execute'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  run-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Script
        env:
          PYTHON_SCRIPT: ${{ inputs.python_code }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "$PYTHON_SCRIPT"
